<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>love card</title>
	<link rel="stylesheet"href="index.css">
</head>
<body>
<div class="valentines-day-card">
  <input id="open" type="checkbox">
  <label class="open" for="open"></label>
<div class="card-front">
  <div class="note">Open the letter</div>
</div>
  
  <div class="card-inside">
    <div class="text-one">Sorry
    </div>
    <div class="heart"></div>
    <div class="smile"></div>
    <div class="eyes"></div>

<audio id="bgMusic" autoplay loop style="display: none;">
  <source src="Sorryna.mp3" type="audio/mp3">
</audio>

<script>
  const openCheckbox = document.getElementById('open');
  const audio = document.getElementById('bgMusic');

  openCheckbox.addEventListener('change', function() {
    if (this.checked) {
      audio.volume = 0.2;
      audio.currentTime = 20;

      audio.play().catch(error => {
        console.log("Playback error:", error);
      });
    } else {
      audio.pause();
    }
  });
  </script>
  
</div>
</div>
</body>
</html>
